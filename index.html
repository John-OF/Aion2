<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Aion 2 · Registro del Daeva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 20 C68 35 88 38 98 48 C92 56 82 56 74 53 C82 62 80 72 70 76 C65 68 62 60 60 52 C58 60 55 68 50 76 C40 72 38 62 46 53 C38 56 28 56 22 48 C32 38 52 35 60 20 Z' fill='%23dfa837'/%3E%3Cpolygon points='60,35 68,60 60,85 52,60' fill='%2338bdf8' stroke='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#11131d; --lowest:#0c0e18; --low:#191b26; --cont:#1d1f2a; --high:#282934; --highest:#323440;
  --text:#e1e1f0; --muted:#d3c4af; --faint:#9ca4c4; --dim:#5a6282;
  --gold:#fec350; --gold-2:#dfa837; --gold-3:#f7bd4b; --on-gold:#3d2a00;
  --aether:#49dfef; --void:#d0bcff; --void-2:#7a3bf5; --rift:#ff8a9a; --rift-2:#e0445f;
  --serif:"Bodoni Moda", Georgia, serif;
  --sans:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"Space Grotesk", ui-monospace, "Segoe UI", sans-serif;
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{
  background:
    radial-gradient(900px 500px at 50% -120px, rgba(60,40,120,.35), transparent 70%),
    var(--bg);
}
body{
  margin:0; min-height:100vh; color:var(--text); font:14px/1.6 var(--sans);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font:600 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(12,14,24,.82); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,.6);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-in{max-width:1400px;margin:0 auto;height:68px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand-name{font:700 16px/1.15 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.brand-sub{display:flex;align-items:center;gap:6px;color:var(--aether);font-size:10px;margin-top:2px}
.pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tb-actions{display:flex;align-items:center;gap:10px}
.seg{display:flex;gap:2px;background:var(--lowest);padding:3px;border-radius:999px}
.seg button{
  border:0;background:none;cursor:pointer;padding:4px 12px;border-radius:999px;
  font:600 11px/1.4 var(--mono);letter-spacing:.1em;color:var(--muted);
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--gold);color:var(--on-gold);box-shadow:0 0 10px rgba(254,195,80,.45)}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:0;cursor:pointer;
  background:var(--cont);color:var(--muted);display:grid;place-items:center;
}
.icon-btn:hover{color:var(--gold);background:var(--high)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="false"] .wave{display:none}
.icon-btn[aria-pressed="true"] .mute{display:none}
:focus-visible{outline:2px solid var(--aether);outline-offset:2px}

/* ---------- Layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 48px;display:grid;gap:24px}

/* ---------- Hero ---------- */
.hero{
  position:relative; overflow:hidden; border-radius:var(--r);
  background:rgba(12,14,24,.8); box-shadow:0 20px 60px rgba(0,0,0,.85);
  padding:28px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px;
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(110px)}
.hero::before{width:380px;height:380px;left:-80px;top:-140px;background:rgba(254,195,80,.12)}
.hero::after{width:480px;height:480px;right:20%;top:-160px;background:rgba(95,3,218,.25)}
.hero > *{position:relative;z-index:1}
.hero-text{max-width:720px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:rgba(254,195,80,.1);color:var(--gold);font-size:10px;
}
h1{
  font:700 clamp(32px,5vw,52px)/1.1 var(--serif); letter-spacing:.03em; color:var(--gold);
  margin:10px 0 6px; text-shadow:0 0 20px rgba(254,195,80,.4);
}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);margin-bottom:8px}
.hero-meta .a{color:var(--aether)} .hero-meta .g{color:#ffdea7} .hero-meta .v{color:var(--void)}
.hero-desc{color:var(--muted);margin:0;max-width:62ch;font-size:15px}
.hero-side{display:flex;flex-wrap:wrap;align-items:center;gap:20px}

.ring-box{display:flex;align-items:center;gap:16px;background:rgba(29,31,42,.7);padding:16px 20px 16px 16px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ring{position:relative;width:80px;height:80px;flex:none}
.ring svg{width:80px;height:80px;transform:rotate(-90deg)}
.ring .track{stroke:var(--highest)}
.ring .fill{transition:stroke-dashoffset .7s ease-out}
.ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-num b{font:700 17px/1 var(--sans);color:var(--gold)}
.ring-num span{font-size:8px;color:var(--muted);margin-top:3px}
.ring-info .label{color:var(--text)}
.ring-info div{color:var(--muted);font-size:13px}

.reset-wrap{position:relative}
.reset{
  display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;border:0;
  padding:10px 20px 10px 12px;border-radius:12px;
  background:linear-gradient(135deg,var(--high),var(--cont) 50%,var(--lowest));
  box-shadow:0 4px 25px rgba(0,0,0,.6); transition:box-shadow .3s;
}
.reset:hover{box-shadow:0 0 30px rgba(254,195,80,.35)}
/* Rune seal */
.reset .orb{position:relative;width:68px;height:68px;flex:none;color:var(--gold)}
.reset .orb .runes{position:absolute;inset:0;width:100%;height:100%;animation:spin 60s linear infinite}
.reset:hover .orb .runes{animation-duration:12s}
.reset .orb .core{
  position:absolute;inset:16px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--gold) 22%,var(--cont)), var(--cont));
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);transition:background .2s;
}
.reset .orb .core svg{width:18px;height:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.reset .t{display:block;color:var(--gold);font:700 14px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.reset .s{display:block;color:var(--muted);font-size:11px;font-family:var(--mono)}
.reset.armed{box-shadow:0 0 0 1px var(--rift-2),0 0 30px rgba(224,68,95,.45)}
.reset.armed .orb{color:var(--rift-2)}
.reset.armed .orb .runes{animation-duration:3s}
.reset.armed .orb .core{background:radial-gradient(circle, color-mix(in srgb,var(--rift-2) 45%,var(--cont)), var(--cont));border-color:var(--rift-2);color:#fff}
.reset.armed .t{color:#ffb3bf}
.reset.flash .orb .core{animation:flash .7s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--gold)}100%{box-shadow:0 0 0 26px transparent}}
.toast{
  position:absolute;right:0;top:calc(100% + 8px);white-space:nowrap;
  background:#93000a;color:#ffdad6;font:600 11px/1.4 var(--mono);letter-spacing:.04em;
  padding:5px 12px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}

/* ---------- Cards ---------- */
#grid{display:grid;gap:24px}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch}
.card{
  position:relative; overflow:hidden; border-radius:var(--r);
  background:rgba(25,27,38,.92); box-shadow:0 12px 36px rgba(0,0,0,.6);
  padding:18px 18px 14px; display:flex; flex-direction:column;
}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--topline);opacity:.85}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:12px;min-width:0}
.badge{
  width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);
  box-shadow:0 0 14px color-mix(in srgb,var(--acc) 28%,transparent);
}
.badge svg{width:22px;height:22px}
h2{font:600 20px/1.25 var(--serif);letter-spacing:.03em;color:var(--acc);margin:0}
.tag{color:var(--muted);font-size:10px;margin-top:2px}
.card-tools{display:flex;align-items:center;gap:6px;flex:none}
.pill{
  padding:2px 10px;border-radius:999px;font:700 11px/1.5 var(--mono);letter-spacing:.06em;
  background:color-mix(in srgb,var(--acc) 85%,#000);color:var(--lowest);font-variant-numeric:tabular-nums;
}
.mini-reset{
  width:30px;height:30px;border-radius:8px;border:0;background:none;cursor:pointer;
  color:var(--muted);display:grid;place-items:center;
}
.mini-reset:hover{color:var(--acc);background:var(--cont)}
.mini-reset svg{width:18px;height:18px}
.bar{height:6px;border-radius:999px;background:var(--highest);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--grad);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 60%,transparent);transition:width .5s}

.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task label{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;
  user-select:none;background:rgba(29,31,42,.6);transition:background .15s;
}
.task label:hover{background:var(--cont)}
.task .txt{color:var(--text);font-size:14px;transition:color .15s}
.task input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--acc) 70%,transparent)}
.task label:hover .txt{color:var(--text)}

/* Diamond crystal checkbox */
input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.dia{
  flex:none;width:16px;height:16px;margin:2px;transform:rotate(45deg);border-radius:2px;
  border:1px solid var(--dim);background:rgba(8,10,18,.6);
  display:grid;place-items:center;transition:background .15s,border-color .15s,box-shadow .15s;
}
.dia::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--lowest);transform:scale(0);transition:transform .15s}
input:checked + .dia{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 70%,transparent)}
input:checked + .dia::after{transform:scale(1)}
input:focus-visible + .dia{outline:2px solid var(--aether);outline-offset:3px}

/* ---------- Alts ---------- */
.alts{padding:22px}
.alts .card-head{margin-bottom:18px}
.alts h2{font-size:26px}
.alts .tag{font:400 14px/1.4 var(--sans);letter-spacing:0;text-transform:none}
.alts .badge{width:48px;height:48px}
.matrix{overflow-x:auto;border-radius:12px;background:rgba(12,14,24,.5)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:12px 8px;text-align:center}
thead th{background:rgba(29,31,42,.9);vertical-align:bottom}
thead th:first-child{color:var(--gold);text-align:left;padding-left:16px}
.alt-head{display:flex;flex-direction:column;align-items:center;gap:6px}
.alt-head .num{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font:700 12px/1 var(--mono);
}
.alt-head .nm{font:600 13px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
th.done .nm{color:var(--gold)}
tbody tr{border-top:1px solid rgba(255,255,255,.04)}
tbody tr:hover{background:rgba(40,41,52,.4)}
tbody th,tfoot th{
  position:sticky;left:0;z-index:1;text-align:left;padding-left:16px;
  background:rgba(25,27,38,.97);font:600 14px/1.3 var(--sans);color:var(--text);min-width:230px;
}
tbody th .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:10px;vertical-align:1px}
td label{display:inline-grid;place-items:center;padding:8px;cursor:pointer;--acc:var(--void)}
td label:hover .dia{border-color:var(--void)}
tfoot tr{background:rgba(40,41,52,.55)}
tfoot th{background:rgba(40,41,52,.97);color:var(--void);font:700 13px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.colp{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.colp i{display:block;width:36px;height:3px;border-radius:2px;background:var(--highest);overflow:hidden}
.colp i b{display:block;height:100%;width:0;background:var(--void);transition:width .4s}
.colp.full{color:var(--gold)} .colp.full i b{background:var(--gold)}

/* ---------- Footer ---------- */
footer{background:var(--lowest);margin-top:8px}
.foot-in{max-width:1400px;margin:0 auto;padding:28px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;color:var(--muted)}
.foot-brand{display:flex;align-items:baseline;gap:10px}
.foot-brand b{font:600 18px/1 var(--serif);letter-spacing:.14em;color:var(--gold)}
.foot-note{font-size:12px;color:var(--faint)}
#sync{color:var(--aether)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){ .triad{grid-template-columns:1fr 1fr} .triad .card:last-child{grid-column:1/-1} }
@media (max-width:720px){
  .topbar-in{padding:0 16px;height:60px}
  .brand-sub{display:none}
  .brand-name{font-size:14px}
  .wrap{padding:16px 16px 40px;gap:16px}
  .hero{padding:20px}
  .hero-side{width:100%}
  .ring-box,.reset-wrap{flex:1 1 240px}
  .reset{width:100%}
  #grid,.triad{gap:16px}
  .triad{grid-template-columns:1fr}
  .alts{padding:16px}
  .alts h2{font-size:22px}
  tbody th,tfoot th{min-width:140px;max-width:160px;font-size:13px;padding-left:12px}
  .foot-in{padding:24px 16px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff5c0"/><stop offset="50%" stop-color="#dfa837"/><stop offset="100%" stop-color="#8c6218"/>
          </linearGradient>
          <radialGradient id="etherGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/><stop offset="60%" stop-color="#dfa837" stop-opacity="0.2"/><stop offset="100%" stop-color="#0a0c16" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <circle cx="60" cy="60" r="54" fill="url(#etherGlow)"/>
        <circle cx="60" cy="60" r="52" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
        <circle cx="60" cy="60" r="46" stroke="#e5c158" stroke-width="0.8" opacity="0.6"/>
        <path d="M60 20 C68 35 88 38 98 48 C92 56 82 56 74 53 C82 62 80 72 70 76 C65 68 62 60 60 52 C58 60 55 68 50 76 C40 72 38 62 46 53 C38 56 28 56 22 48 C32 38 52 35 60 20 Z" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.95"/>
        <polygon points="60,35 68,60 60,85 52,60" fill="#38bdf8" stroke="#fff" stroke-width="1" filter="url(#glow)"/>
        <polygon points="60,45 65,60 60,75 55,60" fill="#bae6fd" opacity="0.85"/>
        <circle cx="60" cy="8" r="2" fill="#dfa837"/><circle cx="60" cy="112" r="2" fill="#dfa837"/>
        <circle cx="8" cy="60" r="2" fill="#dfa837"/><circle cx="112" cy="60" r="2" fill="#dfa837"/>
        <polygon points="60,92 63,98 60,104 57,98" fill="#e5c158"/>
      </svg>
      <div>
        <div class="brand-name" data-i18n="title">Registro del Daeva</div>
        <div class="brand-sub label"><span class="pulse"></span><span data-i18n="brandSub"></span></div>
      </div>
    </div>
    <div class="tb-actions">
      <div class="seg langs" role="group" aria-label="Idioma / Language">
        <button data-lang="es" lang="es">ES</button>
        <button data-lang="en" lang="en">EN</button>
      </div>
      <button class="icon-btn" id="sound" aria-pressed="true">
        <svg class="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        <svg class="mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M9 12h2M14 12h2M19 12h1"/><path d="M4 20 20 4"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <div class="hero-text">
      <span class="chip label"><span class="pulse"></span><span data-i18n="chip"></span></span>
      <h1 data-i18n="title">Registro del Daeva</h1>
      <div class="hero-meta label">
        <span class="a">Aion 2</span><span>◊</span><span class="g">Main</span><span>+</span><span class="v" data-i18n="altsCount"></span>
      </div>
      <p class="hero-desc" data-i18n="sub"></p>
    </div>
    <div class="hero-side">
      <div class="ring-box">
        <div class="ring">
          <svg viewBox="0 0 80 80" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fec350"/><stop offset="60%" stop-color="#49dfef"/><stop offset="100%" stop-color="#d0bcff"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="40" cy="40" r="32" fill="none" stroke-width="5"/>
            <circle class="fill" id="ringFill" cx="40" cy="40" r="32" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="201.06"/>
          </svg>
          <div class="ring-num"><b id="ringPct">0%</b><span class="label" data-i18n="global"></span></div>
        </div>
        <div class="ring-info">
          <span class="label" data-i18n="progress"></span>
          <div id="ringCount"></div>
        </div>
      </div>
      <div class="reset-wrap">
        <button class="reset" id="reset">
          <span class="orb" aria-hidden="true">
            <svg class="runes" viewBox="0 0 148 148" fill="none" stroke="currentColor">
              <circle cx="74" cy="74" r="70" stroke-width="2" opacity=".6"/>
              <circle cx="74" cy="74" r="62" stroke-width="3" stroke-dasharray="3 9"/>
              <circle cx="74" cy="74" r="54" stroke-width="2" opacity=".5"/>
              <g stroke-width="3">
                <path d="M74 4 l6 10 h-12z"/><path d="M74 144 l6 -10 h-12z"/>
                <path d="M4 74 l10 6 v-12z"/><path d="M144 74 l-10 6 v-12z"/>
              </g>
              <g stroke-width="2" opacity=".8">
                <path d="M24.5 24.5 l8 3 -3 -8z"/><path d="M123.5 24.5 l-8 3 3 -8z"/>
                <path d="M24.5 123.5 l8 -3 -3 8z"/><path d="M123.5 123.5 l-8 -3 3 8z"/>
              </g>
            </svg>
            <span class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></span>
          </span>
          <span><span class="t" id="resetLabel"></span><span class="s" id="resetHint"></span></span>
        </button>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </div>
  </section>

  <main id="grid"></main>
</div>

<footer>
  <div class="foot-in">

      ]],

    global:"Global", progress:"Total progress", tasks:"tasks",
    resetTitle:"Full reset", resetArmed:"Clear all?", resetAria:"Full reset: uncheck all boxes",

    footTag:"· Ascended log",
    disclaimer:"Fan-made tool. Not affiliated with NCSOFT.",
    synced:"Synced with your account", saved:"Saved to your account", localOnly:"Saved in this browser only",
    sections:{

const ICONS = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.4 2.4M16.3 16.3l2.4 2.4M5.3 18.7l2.4-2.4M16.3 7.7l2.4-2.4"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/><path d="M12 8v8M9 11h6" stroke-linecap="round"/></svg>',
  swords:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 6.5 21 18M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l-2 2 3 3 2-2" opacity=".55"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14c2.4.2 4 1.7 4.5 4.5"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>'
};

const SECTIONS = [
  { id:"diario", icon:"sun",    acc:"var(--gold)",   grad:"linear-gradient(90deg,var(--gold),var(--gold-3))", top:"linear-gradient(90deg,var(--gold),var(--gold-3) 40%,transparent)" },
  { id:"pve",    icon:"shield", acc:"var(--aether)", grad:"linear-gradient(90deg,var(--aether),#8bf2ff)",       top:"linear-gradient(90deg,var(--aether),transparent)" },
  { id:"pvp",    icon:"swords", acc:"var(--rift)",   grad:"linear-gradient(90deg,var(--rift-2),var(--void-2))", top:"linear-gradient(90deg,var(--rift-2),var(--void-2) 60%,transparent)" }
];
const ALTS = { id:"alts", icon:"users", acc:"var(--void)", top:"linear-gradient(90deg,var(--void-2),var(--void),var(--aether))", cols:7 };
const ALT_COLORS = ["#fec350","#49dfef","#d0bcff","#b18cff","#4ef29f","#f7bd4b","#ff8a9a"];
const ROW_COLORS = ["#49dfef","#fec350","#fec350","#7a3bf5","#49dfef","#ff8a9a","#e0445f"];

let lang = "es";
try { lang = localStorage.getItem("aion2-lang") || ((navigator.language||"").toLowerCase().startsWith("es") ? "es" : "en"); } catch(e){}
if (!I18N[lang]) lang = "es";
const T = () => I18N[lang];
const sec = id => T().sections[id];

const LS_KEY = "aion2-checklist-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch(e){ state = {}; }

const grid = document.getElementById("grid");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function box(key, label){
  return `<input type="checkbox" data-key="${key}" id="${key}" aria-label="${esc(label)}"><span class="dia" aria-hidden="true"></span>`;
}
function head(s, total){
  const [title, tag] = sec(s.id);
  return `<div class="card-head">
      <div class="card-title"><span class="badge" aria-hidden="true">${ICONS[s.icon]}</span>
        <div><h2>${esc(title)}</h2><div class="tag label">${esc(tag)}</div></div></div>
      <div class="card-tools"><span class="pill"><span data-count="${s.id}">0</span>/${total}</span>
        <button class="mini-reset" data-reset="${s.id}" title="${T().sectionReset}" aria-label="${T().sectionReset}: ${esc(title)}">${ICONS.reset}</button></div>
    </div>`;
}

let allBoxes = [];
function build(){
  let html = `<div class="triad">`;
  for (const s of SECTIONS){
    const items = sec(s.id)[2];
    html += `<section class="card" style="--acc:${s.acc};--grad:${s.grad};--topline:${s.top}">${head(s, items.length)}
      <div class="bar"><i data-bar="${s.id}"></i></div><ul class="tasks">`;
    items.forEach((it,i)=>{
      html += `<li class="task"><label>${box(`${s.id}-${i}`, it)}<span class="txt">${esc(it)}</span></label></li>`;
    });
    html += `</ul></section>`;
  }
  html += `</div>`;
  {
    const s = ALTS, items = sec(s.id)[2];
    html += `<section class="card alts" style="--acc:${s.acc};--topline:${s.top}">${head(s, items.length*s.cols)}
      <div class="matrix"><table><thead><tr><th scope="col" class="label">${T().activity}</th>`;
    for (let c=1;c<=s.cols;c++) html += `<th scope="col" data-colhead="${c}"><div class="alt-head" style="--c:${ALT_COLORS[c-1]}"><span class="num">${c}</span><span class="nm">Alt ${c}</span></div></th>`;
    html += `</tr></thead><tbody>`;
    items.forEach((it,i)=>{
      html += `<tr><th scope="row" style="--c:${ROW_COLORS[i % ROW_COLORS.length]}"><span class="dot"></span>${esc(it)}</th>`;
      for (let c=1;c<=s.cols;c++) html += `<td><label>${box(`alts-${i}-${c}`, it+" · Alt "+c)}</label></td>`;
      html += `</tr>`;
    });
    html += `</tbody><tfoot><tr><th scope="row">${T().completed}</th>`;
    for (let c=1;c<=s.cols;c++) html += `<td><div class="colp" data-colcount="${c}"><span>0/${items.length}</span><i><b></b></i></div></td>`;
    html += `</tr></tfoot></table></div></section>`;
  }
  grid.innerHTML = html;
  allBoxes = [...document.querySelectorAll("input[data-key]")];
}

const ringFill = document.getElementById("ringFill"), ringPct = document.getElementById("ringPct"), ringCount = document.getElementById("ringCount");
function render(){
  allBoxes.forEach(b => b.checked = !!state[b.dataset.key]);
  for (const s of [...SECTIONS, ALTS]){
    const boxes = allBoxes.filter(b => b.dataset.key.startsWith(s.id+"-"));
    const n = boxes.filter(b=>b.checked).length;
    document.querySelector(`[data-count="${s.id}"]`).textContent = n;
    const bar = document.querySelector(`[data-bar="${s.id}"]`);
    if (bar) bar.style.width = (boxes.length ? n/boxes.length*100 : 0)+"%";
  }
  const altN = sec(ALTS.id)[2].length;
  for (let c=1;c<=ALTS.cols;c++){
    let n=0; for (let i=0;i<altN;i++) if (state[`alts-${i}-${c}`]) n++;
    const el = document.querySelector(`[data-colcount="${c}"]`);
    el.querySelector("span").textContent = `${n}/${altN}`;
    el.querySelector("b").style.width = (n/altN*100)+"%";
    el.classList.toggle("full", n===altN);
    document.querySelector(`[data-colhead="${c}"]`).classList.toggle("done", n===altN);
  }
  const total = allBoxes.length, done = allBoxes.filter(b=>b.checked).length;
  const pct = total ? Math.round(done/total*100) : 0;
  ringPct.textContent = pct+"%";
  ringFill.style.strokeDashoffset = 201.06 - pct/100*201.06;
  ringCount.textContent = `${done} / ${total} ${T().tasks}`;
}

const syncEl = document.getElementById("sync");
const seal = document.getElementById("reset"), label = document.getElementById("resetLabel"), hint = document.getElementById("resetHint"), toast = document.getElementById("toast");

/* ---- Language ---- */
let syncKey = "";
function setSync(k){ syncKey = k; syncEl.textContent = T()[k]; }
function applyLang(){
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  seal.setAttribute("aria-label", t.resetAria);
  label.textContent = t.resetTitle;
  hint.textContent = t.hint;
  toast.textContent = t.toast;
  document.querySelectorAll("[data-lang]").forEach(b => {
    const on = b.dataset.lang === lang;
    b.setAttribute("aria-pressed", on);
    b.classList.toggle("on", on);
  });
  if (syncKey) syncEl.textContent = t[syncKey];
  renderSoundBtn();
  build(); render();
}

/* ---- Sound effects (Kenney Interface Sounds, CC0) ---- */
const SFX = {};
["check","uncheck","complete","arm","reset","section-reset"].forEach(n => {
  const a = new Audio(`sfx/${n}.mp3`); a.preload = "auto"; SFX[n] = a;
});
let soundOn = true;
try { soundOn = localStorage.getItem("aion2-sound") !== "off"; } catch(e){}
function play(name){
  if (!soundOn || !SFX[name]) return;
  const a = SFX[name].cloneNode(); a.volume = .45;
  a.play().catch(()=>{});
}
const soundBtn = document.getElementById("sound");
function renderSoundBtn(){
  const t = soundOn ? T().soundOn : T().soundOff;
  soundBtn.setAttribute("aria-pressed", soundOn);
  soundBtn.setAttribute("aria-label", t);
  soundBtn.title = t;
}
soundBtn.addEventListener("click", ()=>{
  soundOn = !soundOn;
  try { localStorage.setItem("aion2-sound", soundOn ? "on" : "off"); } catch(e){}
  renderSoundBtn();
  play("check");
});
/* True when the box just checked completes its section (or its alt column) */
function completes(key){
  const m = key.match(/^alts-\d+-(\d+)$/);
  const group = m
    ? allBoxes.filter(b => b.dataset.key.startsWith("alts-") && b.dataset.key.endsWith("-"+m[1]))
    : allBoxes.filter(b => b.dataset.key.startsWith(key.split("-")[0]+"-"));
  return group.every(b => b.checked);
}

document.querySelector(".langs").addEventListener("click", e=>{
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("aion2-lang", lang); } catch(e){}
  disarm(); applyLang();
});

/* ---- Persistence: localStorage now, cloud sync if available ---- */
let dbDoc = null, saveTimer = null;

function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (dbDoc){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try { await dbDoc.set({checks: state, updated: Date.now()}); setSync("saved"); }
      catch(e){ setSync("localOnly"); }
    }, 600);
  }
}

(async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbDoc = db.doc(`data/users/${uid}/checklist`);
    const snap = await dbDoc.get();
    if (snap.exists){
      const d = snap.data();
      if (d && d.checks && typeof d.checks === "object"){ state = {...d.checks}; render(); try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){} }
    }
    setSync("synced");
  }catch(e){ dbDoc = null; }
})();

grid.addEventListener("change", e=>{
  const b = e.target.closest("input[data-key]"); if (!b) return;
  if (b.checked) state[b.dataset.key] = true; else delete state[b.dataset.key];
  render(); persist();
  play(!b.checked ? "uncheck" : completes(b.dataset.key) ? "complete" : "check");
});
grid.addEventListener("click", e=>{
  const btn = e.target.closest("[data-reset]"); if (!btn) return;
  const id = btn.dataset.reset;
  Object.keys(state).forEach(k => { if (k.startsWith(id+"-")) delete state[k]; });
  render(); persist();
  play("section-reset");
});

/* ---- Full reset with two-tap confirmation ---- */
let armTimer = null;
seal.addEventListener("click", ()=>{
  if (!seal.classList.contains("armed")){
    seal.classList.add("armed"); label.textContent = T().resetArmed; hint.textContent = T().again;
    toast.classList.add("show");
    armTimer = setTimeout(disarm, 3500);
    play("arm");
    return;
  }
  disarm();
  state = {}; render(); persist();
  play("reset");
  seal.classList.remove("flash"); void seal.offsetWidth; seal.classList.add("flash");
  hint.textContent = T().cleared;
  setTimeout(()=>{ if (!seal.classList.contains("armed")) hint.textContent = T().hint; }, 2200);
});
function disarm(){
  clearTimeout(armTimer); seal.classList.remove("armed"); toast.classList.remove("show");
  label.textContent = T().resetTitle; hint.textContent = T().hint;
}

/* ---- Starfield background ---- */
(function starfield(){
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TINTS = ["255,255,255","255,255,255","255,255,255","254,195,80","73,223,239","208,188,255"];
  let w, h, dpr, stars = [], shooter = null, nextShot = 0, raf = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const ow = w, oh = h;
    w = innerWidth; h = innerHeight;
    cv.width = w*dpr; cv.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.min(340, Math.round(w*h/5000));
    /* keep existing stars on resize (e.g. mobile address bar) so they don't jump */
    if (ow) stars.forEach(p => { p.x *= w/ow; p.y *= h/oh; });
    stars.length = Math.min(stars.length, n);
    while (stars.length < n) stars.push(makeStar());
    if (still) draw(0);
  }

  function makeStar(){
    return {
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random() < .08 ? 1.2 + Math.random()*.8 : .3 + Math.random()*.9,
      a: .35 + Math.random()*.6, tw: .4 + Math.random()*1.6, ph: Math.random()*Math.PI*2,
      vy: -(.02 + Math.random()*.08), c: TINTS[Math.floor(Math.random()*TINTS.length)]
    };
  }

  function draw(t){
    ctx.clearRect(0,0,w,h);
    const s = t/1000;
    for (const p of stars){
      if (!still){ p.y += p.vy; if (p.y < -2){ p.y = h + 2; p.x = Math.random()*w; } }
      const a = still ? p.a : p.a * (.55 + .45*Math.sin(s*p.tw + p.ph));
      ctx.fillStyle = `rgba(${p.c},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      if (p.r > 1.2){ /* soft glow on the brightest stars */
        ctx.fillStyle = `rgba(${p.c},${(a*.15).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3.5, 0, Math.PI*2); ctx.fill();
      }
    }
    if (still) return;
    /* occasional shooting star */
    if (!shooter && t > nextShot){
      shooter = { x: Math.random()*w*.8 + w*.1, y: Math.random()*h*.35, vx: 7 + Math.random()*4, vy: 2.5 + Math.random()*2, life: 1 };
    }
    if (shooter){
      const q = shooter, g = ctx.createLinearGradient(q.x, q.y, q.x - q.vx*12, q.y - q.vy*12);
      g.addColorStop(0, `rgba(255,236,190,${q.life})`); g.addColorStop(1, "rgba(255,236,190,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx*12, q.y - q.vy*12); ctx.stroke();
      q.x += q.vx; q.y += q.vy; q.life -= .012;
      if (q.life <= 0 || q.x > w + 50 || q.y > h + 50){ shooter = null; nextShot = t + 6000 + Math.random()*10000; }
    }
    raf = requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  document.addEventListener("visibilitychange", ()=>{
    if (still) return;
    cancelAnimationFrame(raf);
    if (!document.hidden) raf = requestAnimationFrame(draw);
  });
  resize();
  nextShot = performance.now() + 4000;
  if (!still) raf = requestAnimationFrame(draw);
})();

applyLang();
</script>
